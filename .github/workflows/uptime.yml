name: Uptime Check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check endpoints
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set +e

          notify_discord() {
            local url="$1"
            local code="$2"
            local expected="$3"

            if [ -z "$DISCORD_WEBHOOK_URL" ]; then
              echo "DISCORD_WEBHOOK_URL not set, skipping notification"
              return 0
            fi

            local msg="🔴 เว็บล่ม: ${url} ได้ ${code} (คาด ${expected})"
            local payload
            payload=$(python3 -c 'import json,sys; print(json.dumps({"content": sys.argv[1]}))' "$msg")

            curl -s -o /dev/null -X POST \
              -H "Content-Type: application/json" \
              -d "$payload" \
              "$DISCORD_WEBHOOK_URL"
          }

          check_url() {
            local url="$1"
            local expected="$2"
            local attempt=1
            local max_attempts=2
            local code=""

            while [ "$attempt" -le "$max_attempts" ]; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url")
              if [ "$code" = "$expected" ]; then
                echo "OK   $url -> $code"
                return 0
              fi
              echo "FAIL (attempt $attempt/$max_attempts) $url -> got $code, expected $expected"
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep 20
              fi
              attempt=$((attempt + 1))
            done

            echo "DOWN $url -> $code (expected $expected)"
            notify_discord "$url" "$code" "$expected"
            return 1
          }

          status=0

          check_url "https://laventia-event.com/healthz" "200" || status=1
          check_url "https://tarot.laventia-event.com/" "401" || status=1
          check_url "https://card.laventia-event.com/robots.txt" "200" || status=1

          exit $status
